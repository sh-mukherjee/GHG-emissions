name: Refresh GHG data snapshot

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas pyarrow

      - name: Rebuild the snapshot
        run: python scripts/snapshot.py

      - name: Commit if the data changed
        run: |
          if [ -z "$(git status --porcelain public/)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ghg.parquet
          git commit -m "chore: refresh GHG data snapshot"
          git push
